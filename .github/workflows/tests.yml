name: tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: analytics
          POSTGRES_USER: analytics
          POSTGRES_PASSWORD: analytics
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U analytics"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python manage.py test
        env:
          SECRET_KEY: test-secret
          DEBUG: "1"
          DB_HOST: localhost
          DB_NAME: analytics
          DB_USER: analytics
          DB_PASSWORD: analytics
          USE_REDIS: "0"
